name: Deploy Webhook 99Food

on:
    push:
        branches: [master]

jobs:
    deploy:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Set build version
              run: |
                  bun -e '
                    const fs = require("fs");
                    const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
                    const [major, minor] = pkg.version.split(".");
                    pkg.version = `${major}.${minor}.${process.env.GITHUB_RUN_NUMBER}`;
                    fs.writeFileSync("package.json", JSON.stringify(pkg, null, 4) + "\n");
                    console.log("Build version:", pkg.version);
                  '

            - name: Build binary for Linux
              run: |
                  bun build src/index.js --compile --target=bun-linux-x64 --outfile=server
                  chmod +x server

            - name: Deploy files to VPS
              uses: appleboy/scp-action@master
              with:
                  host: ${{ secrets.VPS_HOST }}
                  username: ${{ secrets.VPS_USER }}
                  key: ${{ secrets.SSH_PRIVATE_KEY }}
                  port: ${{ secrets.VPS_PORT }}
                  source: "server"
                  target: "/var/www/webhook-99food"

            - name: Restart service
              uses: appleboy/ssh-action@master
              with:
                  host: ${{ secrets.VPS_HOST }}
                  username: ${{ secrets.VPS_USER }}
                  key: ${{ secrets.SSH_PRIVATE_KEY }}
                  port: ${{ secrets.VPS_PORT }}
                  script: |
                      chmod +x /var/www/webhook-99food/server
                      systemctl restart webhook-99food
                      systemctl status webhook-99food --no-pager
